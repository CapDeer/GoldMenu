<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #1f2430;
      background: #ffffff;
      font-size: 12px;
      user-select: none;
      overflow: hidden;
    }
    .panel { width: 340px; max-height: 690px; overflow-y: auto; }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .header {
      display: flex; align-items: center; padding: 12px 16px 10px;
      border-bottom: 1px solid #edf0f3; position: sticky; top: 0; background: #fff; z-index: 2;
    }
    .header h1 { font-size: 13px; font-weight: 600; }
    .header .spacer { flex: 1; }
    .header button {
      border: none; background: transparent; cursor: pointer; color: #6b7280;
      font-size: 14px; padding: 2px 6px; border-radius: 4px;
    }
    .header button:hover { background: #f3f4f6; }
    .up { color: #e53935 !important; }
    .down { color: #16a34a !important; }
    .spot { padding: 14px 16px 10px; }
    .spot .meta { font-size: 11px; color: #9ca3af; margin-bottom: 2px; }
    .spot .price-row { display: flex; align-items: baseline; gap: 8px; }
    .spot .price { font-size: 38px; font-weight: 600; letter-spacing: -1px; }
    .spot .unit { font-size: 13px; color: #9ca3af; }
    .spot .change-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 14px; font-weight: 500; }
    .badge { padding: 2px 6px; border-radius: 5px; font-size: 12px; }
    .badge.up { background: rgba(229,57,53,.12); }
    .badge.down { background: rgba(22,163,74,.12); }
    .spot .vs { font-size: 10px; color: #9ca3af; font-weight: 400; }
    .chart-wrap { padding: 4px 16px 8px; }
    .chart-wrap canvas { width: 100%; height: 130px; display: block; }
    .chart-axis { display: flex; justify-content: space-between; font-size: 9px; color: #9ca3af; margin-top: 2px; }
    .grid { display: flex; padding: 10px 12px; border-top: 1px solid #edf0f3; border-bottom: 1px solid #edf0f3; }
    .grid .cell { flex: 1; text-align: center; }
    .grid .cell .k { font-size: 10px; color: #9ca3af; margin-bottom: 3px; }
    .grid .cell .v { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .section { padding: 12px 16px; border-bottom: 1px solid #edf0f3; }
    .section-title { font-size: 11px; color: #6b7280; margin-bottom: 8px; display: flex; }
    .section-title .count { margin-left: auto; color: #9ca3af; font-size: 10px; }
    .periods { display: flex; gap: 8px; }
    .periods .p { flex: 1; text-align: center; background: #f7f8fa; border-radius: 7px; padding: 7px 0; }
    .periods .p .k { font-size: 10px; color: #9ca3af; margin-bottom: 3px; }
    .periods .p .v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .note { font-size: 9px; color: #b0b5bd; margin-top: 8px; }
    .pgroup { margin-bottom: 8px; }
    .pgroup .t { font-size: 10px; font-weight: 500; color: #6b7280; margin-bottom: 3px; }
    .prow { display: flex; align-items: baseline; padding: 3px 0; }
    .prow .name { font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .prow .note { margin: 0 6px 0 auto; font-size: 9px; color: #b0b5bd; }
    .prow .price { font-size: 12px; font-weight: 600; min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
    .footer { display: flex; align-items: center; padding: 10px 16px; font-size: 10px; color: #9ca3af; }
    .footer .spacer { flex: 1; }
    .footer button { border: none; background: transparent; color: #6b7280; font-size: 11px; cursor: pointer; }
    .footer button:hover { color: #1f2430; }
    .empty { padding: 40px 16px; text-align: center; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="header">
      <h1>今日金价</h1>
      <div class="spacer"></div>
      <button id="refreshBtn" title="立即刷新">⟳</button>
      <button id="closeBtn" title="关闭">✕</button>
    </div>
    <div id="content"><div class="empty">加载中…</div></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
